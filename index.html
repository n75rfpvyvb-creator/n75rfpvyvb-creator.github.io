<script>
(() => {
'use strict';

/* ===== НАСТРОЙКА: после создания Mini App впиши сюда её ссылку (t.me/бот/игра) ===== */
const SHARE_URL = 'https://t.me/vovanewyear2027_bot/vovanewyear2027';

/* ================= Telegram ================= */
let tg = null, inTG = false;
const tgv = v => { try { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v)); } catch (e) { return false; } };
function initTG() {
  if (tg || !(window.Telegram && window.Telegram.WebApp)) return;
  tg = window.Telegram.WebApp; inTG = !!tg.initData;
  try { tg.ready(); } catch (e) {}
  try { tg.expand(); } catch (e) {}
  if (tgv('7.7')) try { tg.disableVerticalSwipes(); } catch (e) {}
  if (tgv('6.1')) try { tg.setHeaderColor('#0b1433'); tg.setBackgroundColor('#0b1433'); } catch (e) {}
  // на телефонах — полный экран без верхней полосы Telegram
  if (tgv('8.0') && (tg.platform === 'ios' || tg.platform === 'android')) try { tg.requestFullscreen(); } catch (e) {}
  try { tg.onEvent('viewportChanged', e => { if (!e || e.isStateStable) relayout(); }); tg.onEvent('fullscreenChanged', () => relayout()); } catch (e) {}
  const user = inTG && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (user && user.first_name) document.getElementById('hello').textContent = `Привет, ${user.first_name}! Вова уже ждёт 🐾`;
  store.get('vova_best').then(v => { if (v > best) { best = v; document.getElementById('bs').textContent = 'РЕКОРД ' + best; document.getElementById('mbest').textContent = 'Твой рекорд: ' + best; } });
}
function hap(kind, arg) {
  if (!tgv('6.1') || !tg.HapticFeedback) return;
  try {
    if (kind === 'impact') tg.HapticFeedback.impactOccurred(arg);
    else if (kind === 'notify') tg.HapticFeedback.notificationOccurred(arg);
    else tg.HapticFeedback.selectionChanged();
  } catch (e) {}
}
const store = {
  get(k) {
    return new Promise(res => {
      let v = 0;
      try { v = +localStorage.getItem(k) || 0; } catch (e) {}
      if (tgv('6.9') && tg.CloudStorage) {
        try { tg.CloudStorage.getItem(k, (err, val) => res(Math.max(v, err ? 0 : (+val || 0)))); }
        catch (e) { res(v); }
      } else res(v);
    });
  },
  set(k, v) {
    try { localStorage.setItem(k, String(v)); } catch (e) {}
    if (tgv('6.9') && tg.CloudStorage) try { tg.CloudStorage.setItem(k, String(v)); } catch (e) {}
  }
};

/* ================= Утилиты ================= */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = Math.random;
const rnd = (a, b) => a + R() * (b - a);
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return { c, g }; }
function P(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function E(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    const dy = (y + .5 - cy) / ry; if (Math.abs(dy) > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy); const x0 = Math.round(cx - hw), x1 = Math.round(cx + hw);
    if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1);
  }
}
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function grad(g, w, h, stops) {
  const cs = stops.map(s => [s[0], hex(s[1])]);
  const sample = t => { for (let i = 0; i < cs.length - 1; i++) { const a = cs[i], b = cs[i + 1]; if (t <= b[0]) { const k = (t - a[0]) / (b[0] - a[0] || 1); return a[1].map((v, j) => Math.round(v + (b[1][j] - v) * k)); } } return cs[cs.length - 1][1]; };
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const N = 14;
  for (let y = 0; y < h; y++) {
    const q = y / Math.max(1, h - 1) * N, b = Math.floor(q), f = q - b;
    g.fillStyle = rgb(sample(b / N)); g.fillRect(0, y, w, 1);
    if (f > 0.5 && b < N) { g.fillStyle = rgb(sample((b + 1) / N)); for (let x = (y & 1); x < w; x += 2) g.fillRect(x, y, 1, 1); }
  }
}
function outline(c, col) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h).data, pts = [];
  const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (!on(x, y) && (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1))) pts.push(x, y);
  g.fillStyle = col; for (let i = 0; i < pts.length; i += 2) g.fillRect(pts[i], pts[i + 1], 1, 1);
}
const LIGHTS = ['#ff4d5e', '#ffd34d', '#4dd2ff', '#7dff6a', '#ff8af0'];
const TW = 256;
const W3 = (fn, x) => { fn(x); fn(x - TW); fn(x + TW); };

function fir(g, cx, base, h, col, shade, snow, lights, rng) {
  const trunkH = Math.max(2, Math.round(h * 0.12));
  P(g, cx - 1, base - trunkH, 3, trunkH, '#3b2616');
  const top = base - h, th = (h - trunkH) / 3;
  for (let t = 0; t < 3; t++) {
    const ty = top + t * th * 0.85, tH = th * 1.25, maxW = h * 0.18 + t * h * 0.07;
    for (let r = 0; r < tH; r++) {
      const hw = Math.max(1, Math.round(maxW * (r + 1) / tH)), y = Math.round(ty + r);
      P(g, cx - hw, y, hw * 2 + 1, 1, r < 1 ? snow : col);
      if (r >= 1) P(g, cx + 1, y, hw, 1, shade);
    }
    const hb = Math.round(maxW); P(g, cx - hb, Math.round(ty + tH - 1), hb + 2, 1, snow);
  }
  if (lights && rng) {
    const n = Math.round(h / 3.5);
    for (let i = 0; i < n; i++) {
      const fy = 0.12 + rng() * 0.8, y = top + fy * (h - trunkH), hw = fy * h * 0.28;
      P(g, cx + Math.round((rng() * 2 - 1) * hw), y, 1, 1, LIGHTS[(rng() * LIGHTS.length) | 0]);
    }
  }
}

/* ================= Вова (спрайты) ================= */
const DP = { B: '#9a5631', L: '#c47e48', H: '#e8b077', D: '#6b351b', S: '#d8a06a', K: '#1a100b', O: '#2e1508', P: '#f07a8a' };
const DOG_W = 30, DOG_H = 22;
function buildDog(pose) {
  const w = DOG_W, h = DOG_H, gr = new Array(w * h).fill(0);
  const set = (x, y, k) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < w && y < h) gr[y * w + x] = k; };
  const el = (cx, cy, rx, ry, k) => { for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) set(x, y, k); } };
  const rc = (x, y, ww, hh, k) => { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) set(x + i, y + j, k); };
  const leg = (x, ext, dir, k) => { if (ext) { rc(x, 13, 3, 6, k); rc(x + dir, 19, 3, 3, k); } else { rc(x, 13, 3, 4, k); rc(x + dir * 2, 16, 3, 2, k); } };
  const slide = pose === 'slide';
  let yo = 1;
  if (pose === 'a') { leg(5, 1, -1, 'D'); leg(18, 0, 1, 'D'); leg(8, 0, -1, 'B'); leg(21, 1, 1, 'B'); }
  else if (pose === 'b') { leg(5, 0, -1, 'D'); leg(18, 1, 1, 'D'); leg(8, 1, -1, 'B'); leg(21, 0, 1, 'B'); }
  else if (pose === 'n') { yo = 0; leg(5, 1, 0, 'D'); leg(18, 1, 0, 'D'); leg(8, 1, 0, 'B'); leg(21, 1, 0, 'B'); }
  else if (pose === 'jump') { yo = 0; rc(1, 14, 5, 3, 'D'); rc(3, 16, 5, 3, 'B'); rc(20, 14, 5, 3, 'D'); rc(23, 15, 5, 3, 'B'); }
  else if (slide) { yo = 5; rc(0, 18, 6, 2, 'D'); rc(1, 20, 6, 2, 'B'); rc(22, 18, 6, 2, 'D'); rc(23, 20, 6, 2, 'B'); }

  el(4, 8 + yo + (slide ? 3 : 0), 2.8, 2.8, 'L');          // хвост-помпон
  el(12, 12.5 + yo, 7.5, slide ? 3.6 : 4.3, 'B');           // тело
  el(20.5, 8 + yo, 5.6, 5.5, 'B');                          // голова
  el(20.5, 3.6 + yo, 4.3, 2.8, 'L');                        // кудрявая чёлка
  el(25.4, 10.3 + yo, 2.6, 2.1, 'S');                       // мордочка
  el(17.6, 10.6 + yo, 2.4, 4.2, 'D');                       // ушко

  // кудряшки
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, k = gr[i]; if (!k) continue;
    const c = (x + 2 * (y >> 1)) % 4, r = y & 1;
    if (k === 'B') { if (c === 0 && r === 0) gr[i] = 'L'; else if (c === 2 && r === 1) gr[i] = 'D'; }
    else if (k === 'L') { if (c === 0 && r === 0) gr[i] = 'H'; else if (c === 2 && r === 1) gr[i] = 'B'; }
    else if (k === 'D') { if (c === 3 && r === 0) gr[i] = 'B'; }
  }
  // глаза, нос, язычок
  if (slide) { set(21, 8 + yo, 'K'); set(22, 7 + yo, 'K'); set(23, 8 + yo, 'K'); set(22, 10 + yo, 'P'); }
  else { set(22, 7 + yo, 'K'); set(22, 8 + yo, 'K'); }
  set(26, 9 + yo, 'K'); set(27, 9 + yo, 'K'); set(27, 10 + yo, 'K');
  set(25, 11 + yo, 'D');
  if (pose === 'a' || pose === 'b' || pose === 'n') { set(25, 12 + yo, 'P'); set(26, 12 + yo, 'P'); }

  const out = gr.slice();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (gr[y * w + x]) continue;
    const n = (xx, yy) => xx >= 0 && yy >= 0 && xx < w && yy < h && gr[yy * w + xx];
    if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) out[y * w + x] = 'O';
  }
  const { c, g } = canvasOf(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const k = out[y * w + x]; if (k) { g.fillStyle = DP[k]; g.fillRect(x, y, 1, 1); } }
  return c;
}
const DOG = {}; ['a', 'b', 'n', 'jump', 'slide'].forEach(p => DOG[p] = buildDog(p));
const RUN = ['a', 'n', 'b', 'n'];

/* ================= Препятствия и подарки ================= */
const OBS = {
  stump: { w: 14, h: 12, d(g) { P(g, 1, 4, 12, 8, '#5b3a24'); P(g, 2, 5, 2, 7, '#7a5134'); P(g, 9, 6, 1, 5, '#3e2716'); P(g, 6, 8, 1, 3, '#3e2716'); P(g, 1, 3, 12, 1, '#c9d6ee'); P(g, 0, 1, 14, 2, '#fff'); P(g, 1, 0, 12, 1, '#fff'); P(g, 2, 3, 2, 2, '#fff'); P(g, 10, 3, 1, 3, '#fff'); } },
  tree: { w: 16, h: 24, d(g) { fir(g, 8, 24, 24, '#1f6b44', '#185836', '#f2f7ff', true, mulberry(5)); P(g, 7, 0, 2, 1, '#ffd34d'); } },
  drift: { w: 22, h: 9, d(g) { E(g, 11, 10, 11, 9.5, '#e9f1ff'); E(g, 13.5, 10.5, 8, 6, '#d2def3'); E(g, 9, 4, 4, 1.5, '#fff'); } },
  snowman: { w: 16, h: 26, d(g) {
    E(g, 8, 20.5, 6.5, 5.5, '#f4f8ff'); E(g, 10, 22, 4, 3.5, '#dbe5f5'); E(g, 8, 13, 5, 4.5, '#f4f8ff'); E(g, 8, 6.5, 3.6, 3.4, '#f4f8ff');
    P(g, 4, 3, 8, 1, '#262a3a'); P(g, 5, 0, 6, 3, '#262a3a'); P(g, 5, 2, 6, 1, '#c2303a');
    P(g, 6, 6, 1, 1, '#222'); P(g, 9, 6, 1, 1, '#222'); P(g, 10, 7, 3, 1, '#f08a24');
    P(g, 4, 9, 8, 2, '#d23a3a'); P(g, 9, 11, 2, 4, '#d23a3a'); P(g, 7, 14, 1, 1, '#333'); P(g, 7, 17, 1, 1, '#333');
    P(g, 0, 12, 4, 1, '#6b4226'); P(g, 12, 12, 4, 1, '#6b4226'); P(g, 0, 11, 1, 1, '#6b4226'); P(g, 15, 11, 1, 1, '#6b4226'); } },
  snowball: { w: 10, h: 10, roll: 0.35, d(g) { E(g, 5, 5, 5, 5, '#cddaf0'); E(g, 4.5, 4.5, 4.3, 4.3, '#f6f9ff'); P(g, 3, 2, 2, 1, '#fff'); P(g, 6, 6, 1, 1, '#c0cfe8'); } },
  fence: { w: 20, h: 12, d(g) { P(g, 0, 4, 20, 2, '#5b3a24'); P(g, 0, 8, 20, 2, '#5b3a24'); for (const x of [1, 8, 15]) { P(g, x, 1, 3, 11, '#7a5134'); P(g, x, 0, 3, 2, '#fff'); } P(g, 0, 3, 20, 1, '#fff'); } },
  gift: { w: 14, h: 13, d(g) { P(g, 0, 4, 14, 9, '#d93848'); P(g, 11, 6, 3, 7, '#ae2636'); P(g, 0, 3, 14, 2, '#f0596a'); P(g, 6, 3, 2, 10, '#ffd34d'); P(g, 0, 8, 14, 2, '#ffd34d'); P(g, 3, 0, 3, 3, '#ffd34d'); P(g, 8, 0, 3, 3, '#ffd34d'); P(g, 4, 1, 1, 1, '#d93848'); P(g, 9, 1, 1, 1, '#d93848'); } },
  giftstack: { w: 16, h: 24, d(g) { P(g, 0, 12, 16, 12, '#2f9e5b'); P(g, 12, 14, 4, 10, '#237a45'); P(g, 7, 12, 2, 12, '#e23b4b'); P(g, 0, 17, 16, 2, '#e23b4b'); P(g, 2, 3, 12, 9, '#3a7bd5'); P(g, 11, 4, 3, 8, '#2b5fae'); P(g, 7, 3, 2, 9, '#fff'); P(g, 2, 6, 12, 1, '#fff'); P(g, 4, 0, 3, 3, '#fff'); P(g, 9, 0, 3, 3, '#fff'); } },
  bauble: { w: 12, h: 12, roll: 0.3, d(g) { E(g, 6, 7, 5.5, 5, '#c42a4a'); E(g, 7, 8, 3.5, 3, '#a51f3c'); P(g, 1, 7, 10, 1, '#ffd34d'); P(g, 3, 4, 2, 2, '#ff9aae'); P(g, 5, 0, 3, 2, '#e0b84a'); } },

    const a = pts[i], b = pts[i + 1] || [TW, pts[0][1]], t = (xx - a[0]) / (b[0] - a[0]), h = a[1] + (b[1] - a[1]) * t, top = Math.round(G - 6 - h), desc = b[1] < a[1];
    P(far.g, xx, top, 1, G - top, desc ? '#1f465c' : '#2b5a74');
    P(far.g, xx, top, 1, Math.max(1, Math.round((h - 35) * 0.5)) + 1, desc ? '#b9dbe9' : '#e2f5fc');
  }
  P(far.g, 0, G - 7, TW, 7, '#7fb6cf'); P(far.g, 0, G - 7, TW, 1, '#c9ecf7');
  const mid = canvasOf(TW, G);
  for (let x2 = 15; x2 < TW; x2 += 35 + rng() * 38) { const h = 30 + rng() * 30, cx = Math.round(x2); W3(xx => fir(mid.g, xx, G, h, '#0d3434', '#0a2a2a', '#cfeaf2', false), cx); }
  const gh = H - G, gr = canvasOf(TW, gh), q = gr.g;
  P(q, 0, 0, TW, gh, '#cdeef9'); P(q, 0, Math.round(gh * .5), TW, gh, '#b3e0f2');
  for (let i = 0; i < TW * gh / 50; i++) P(q, (rng() * TW) | 0, 3 + ((rng() * (gh - 3)) | 0), 3 + ((rng() * 6) | 0), 1, '#eaf9ff');
  for (let i = 0; i < TW * gh / 260; i++) { const cx = (rng() * TW) | 0, cy = 5 + ((rng() * (gh - 6)) | 0); P(q, cx, cy, 4, 1, '#94c8de'); P(q, cx + 3, cy + 1, 3, 1, '#94c8de'); }
  P(q, 0, 0, TW, 2, '#ffffff');
  return { sky: s.c, stars, far: far.c, mid: mid.c, ground: gr.c, snow: true, flyers: true, obs: ['ice', 'tree', 'snowball', 'snowman'] };
}
function buildLocs() { return [locForest(), locGlade(), locRoom(), locNight(), locAurora()]; }

/* ================= Звук ================= */
let AC = null, muted = false;
try { muted = localStorage.getItem('vova_muted') === '1'; } catch (e) {}
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function tone(f1, f2, dur, type, vol, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), gn = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  gn.gain.setValueAtTime(vol || 0.05, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  jump: () => tone(420, 760, 0.12, 'square', 0.045),
  jump2: () => tone(620, 1100, 0.12, 'square', 0.04),
  gift: () => { tone(988, 0, 0.08, 'triangle', 0.09); tone(1319, 0, 0.16, 'triangle', 0.09, 0.07); },
  slip: () => { tone(700, 160, 0.5, 'triangle', 0.09); tone(330, 0, 0.12, 'sine', 0.06, 0.5); },
  loc: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0, 0.14, 'triangle', 0.06, i * 0.09)),
  rec: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, 0.18, 'square', 0.04, i * 0.11))
};
// «Jingle Bells» (народная мелодия 1857 г.) — чиптюн-петля
const MEL = [['E',1],['E',1],['E',2],['E',1],['E',1],['E',2],['E',1],['G',1],['C',1.5],['D',.5],['E',4],['F',1],['F',1],['F',1.5],['F',.5],['F',1],['E',1],['E',1],['E',.5],['E',.5],['E',1],['D',1],['D',1],['E',1],['D',2],['G',2],
  ['E',1],['E',1],['E',2],['E',1],['E',1],['E',2],['E',1],['G',1],['C',1.5],['D',.5],['E',4],['F',1],['F',1],['F',1.5],['F',.5],['F',1],['E',1],['E',1],['E',.5],['E',.5],['G',1],['G',1],['F',1],['D',1],['C',4]];
const NF = { C: 523.25, D: 587.33, E: 659.25, F: 698.46, G: 783.99 };
const BASS = ['C','C','C','C','F','C','G','G','C','C','C','C','F','C','G','C'];
const BF = { C: [130.81, 196], F: [87.31, 130.81], G: [98, 146.83] };
const music = {
  on: false, next: 0, bnext: 0, i: 0, bar: 0, beat: 0.3,
  start() { if (!AC) return; this.on = true; this.reset(); },
  reset() { this.i = 0; this.bar = 0; this.next = this.bnext = AC.currentTime + 0.1; },
  stop() { this.on = false; },
  tick() {
    if (!this.on || !AC || muted) return;
    const now = AC.currentTime; if (this.next < now - 0.3) this.reset();
    while (this.next < now + 0.25) { const [n, d] = MEL[this.i]; tone(NF[n], 0, d * this.beat * 0.85, 'square', 0.02, this.next - now); this.next += d * this.beat; this.i = (this.i + 1) % MEL.length; }
    while (this.bnext < now + 0.25) { const b = BF[BASS[this.bar]]; tone(b[0], 0, this.beat * 1.8, 'triangle', 0.05, this.bnext - now); tone(b[1], 0, this.beat * 1.8, 'triangle', 0.04, this.bnext - now + this.beat * 2); this.bnext += this.beat * 4; this.bar = (this.bar + 1) % BASS.length; }
  }
};

/* ================= Игра ================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const V0 = 95, VMAX = 245, ACC = 1.6, GRAV = 1100, JUMP = 330, JUMP2 = 290;

let state = 'menu', t = 0, worldX = 0, speed = V0, runTime = 0, gifts = 0, best = 0;
let obstacles = [], pickups = [], parts = [], flakes = [];
let nextObsAt = 0, nextPickAt = 0, locIdx = 0, prevLoc = -1, fade = 0, slipT = 0, sleigh = null, sleighT = 3;
const dog = { x: 30, baseX: 30, h: 0, vy: 0, jumps: 0, anim: 0, svx: 0 };

function layout() {
  const vw = window.innerWidth || 360, vh = window.innerHeight || 640;
  let s = Math.min(vw / 200, vh / 180), w = Math.round(vw / s);
  if (w > 380) { w = 380; s = vw / 380; }
  W = w; H = Math.max(150, Math.round(vh / s)); G = Math.round(H * (H > W ? 0.74 : 0.72)); if (H - G < 30) G = H - 30;
  cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
  dog.baseX = Math.max(16, Math.round(W * 0.15)); if (state === 'menu' || state === 'play') dog.x = dog.baseX;
  LOCS = buildLocs();
  flakes = []; const n = Math.round(W * H / 1300);
  for (let i = 0; i < n; i++) flakes.push({ x: R() * W, y: R() * H, s: R() < 0.25 ? 2 : 1, vy: 12 + R() * 22, ph: R() * 6.28 });
}
let rT = 0; const relayout = () => { clearTimeout(rT); rT = setTimeout(layout, 120); };
window.addEventListener('resize', relayout);

function banner(text) { const b = $('banner'); b.textContent = '✦ ' + text + ' ✦'; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function score() { return Math.floor(worldX / 10) + gifts * 10; }

function start() {
  ensureAudio();
  $('menu').classList.add('hidden'); $('over').classList.add('hidden');
  state = 'play'; worldX = 0; runTime = 0; speed = V0; gifts = 0;
  obstacles = []; pickups = []; parts = [];
  nextObsAt = W * 0.9; nextPickAt = W * 0.5; locIdx = 0; prevLoc = -1; fade = 0;
  dog.x = dog.baseX; dog.h = 0; dog.vy = 0; dog.jumps = 0; sleigh = null; sleighT = 3;
  banner(LOC_NAMES[0]); music.start(); hap('impact', 'medium');
}
function press() {
  ensureAudio();
  if (state === 'menu') { start(); return; }
  if (state !== 'play') return;
  if (dog.h <= 0.01 && dog.vy <= 0) { dog.vy = JUMP; dog.jumps = 1; sfx.jump(); hap('impact', 'light'); puff(dog.x + 14, G, 5, ['#ffffff', '#dfe8f7'], 30); }
  else if (dog.jumps < 2) { dog.vy = JUMP2; dog.jumps = 2; sfx.jump2(); hap('impact', 'light'); puff(dog.x + 12, G - dog.h - 4, 7, ['#ffd34d', '#ffffff', '#9fd0ff'], 50); }
}
function puff(x, y, n, cols, sp) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-sp, sp), vy: rnd(-sp * 1.2, -sp * 0.2), g: 60, life: rnd(0.3, 0.7), max: 0.7, col: cols[(R() * cols.length) | 0], s: R() < .3 ? 2 : 1, w: false }); }
function floatText(x, y, txt) { parts.push({ x, y, vx: 0, vy: -28, g: 0, life: 0.9, max: 0.9, txt, w: false }); }

function mkObs(k, x, lift, extra) { const d = OBS[k]; return { k, x, lift, extra, w: d.w, h: d.h, spr: d.spr }; }
function spawnObstacle() {
  const L = LOCS[locIdx]; let extra = 0;
  if (L.flyers && runTime > 15 && R() < 0.16) { extra = 55; obstacles.push(mkObs('flyer', W + 4, 22, extra)); }
  else {
    const k = L.obs[(R() * L.obs.length) | 0], d = OBS[k]; extra = d.roll ? speed * d.roll : 0;
    obstacles.push(mkObs(k, W + 4, 0, extra));
    if (speed > 125 && R() < 0.2 && d.w <= 14 && d.h <= 13) obstacles.push(mkObs(k, W + 6 + d.w + ((R() * 3) | 0), 0, extra));
  }
  const lvl = Math.min(1, (speed - V0) / (VMAX - V0));
  const minGap = speed * 0.62 + 60, maxGap = minGap + speed * (1.1 - 0.5 * lvl) + 40;
  nextObsAt = worldX + rnd(minGap, maxGap) * (1 + extra / speed * 0.8);
}
function spawnPickup() {
  const near = obstacles.find(o => Math.abs(o.x - (W + 4)) < 34);
  nextPickAt = worldX + rnd(140, 320);
  if (near && near.k === 'flyer') return;
  let h = near ? near.h + near.lift + 14 + R() * 10 : [4, 20, 38, 58][(R() * 4) | 0];
  const arc = R() < 0.25;
  const n = arc ? 3 : 1;
  for (let i = 0; i < n; i++) pickups.push({ x: W + 4 + i * 14, h: h + (arc && i === 1 ? 12 : 0), ph: R() * 6.28, spr: PRESENTS[(R() * PRESENTS.length) | 0] });
}

function crash() {
  state = 'slip'; slipT = 0; dog.svx = Math.min(120, speed * 0.55);
  sfx.slip(); music.stop(); hap('notify', 'warning');
}
async function showOver() {
  state = 'over';
  const sc = score(), isRec = sc > best;
  if (isRec) { best = sc; store.set('vova_best', best); sfx.rec(); hap('notify', 'success'); }
  $('oDist').textContent = Math.floor(worldX / 10) + ' м';
  $('oGifts').textContent = gifts; $('oScore').textContent = sc; $('oBest').textContent = best;
  $('rec').classList.toggle('hidden', !isRec);
  $('bs').textContent = 'РЕКОРД ' + best;
  $('over').classList.remove('hidden');
  const btns = [$('again'), $('share')]; btns.forEach(b => b.disabled = true);
  setTimeout(() => btns.forEach(b => b.disabled = false), 600);
}

function update(dt) {
  t += dt;
  if (state === 'menu') { worldX += 55 * dt; dog.anim += dt * 55 / 12; }
  else if (state === 'play') {
    runTime += dt; speed = Math.min(VMAX, V0 + runTime * ACC); worldX += speed * dt; dog.anim += dt * speed / 13;
    if (dog.h > 0 || dog.vy > 0) { dog.vy -= GRAV * dt; dog.h += dog.vy * dt; if (dog.h <= 0) { dog.h = 0; dog.vy = 0; dog.jumps = 0; puff(dog.x + 14, G, 4, ['#ffffff', '#dfe8f7'], 25); } }
    if (worldX >= nextObsAt) spawnObstacle();
    if (worldX >= nextPickAt) spawnPickup();
    const li = Math.floor(worldX / LOC_LEN) % LOCS.length;
    if (li !== locIdx) { prevLoc = locIdx; locIdx = li; fade = 1; banner(LOC_NAMES[li]); sfx.loc(); hap('impact', 'soft'); }
  }
  else if (state === 'slip') {
    slipT += dt; speed *= Math.exp(-3.5 * dt); worldX += speed * dt;
    if (dog.h > 0 || dog.vy > 0) { dog.vy -= GRAV * dt; dog.h += dog.vy * dt; if (dog.h <= 0) { dog.h = 0; dog.vy = 0; } }
    if (dog.h === 0) {
      dog.x += dog.svx * dt; dog.svx *= Math.exp(-2.6 * dt);
      if (dog.svx > 15 && R() < 0.8) parts.push({ x: dog.x + 27, y: G - 2, vx: rnd(10, 50), vy: rnd(-60, -20), g: 140, life: 0.5, max: 0.5, col: LOCS[locIdx].snow ? '#ffffff' : '#ffd34d', s: R() < .4 ? 2 : 1, w: false });
    }
    if (slipT > 1.15 && slipT - dt <= 1.15) puff(dog.x + 15, G - 12, 10, ['#ffffff', '#e6ecff'], 40);
    if (slipT > 1.7) showOver();
  }

  if (state === 'play' || state === 'slip') {
    for (const o of obstacles) o.x -= (speed + (state === 'play' ? o.extra : 0)) * dt;
    for (const p of pickups) p.x -= speed * dt;
    obstacles = obstacles.filter(o => o.x > -30 && !o.dead);
    pickups = pickups.filter(p => p.x > -14 && !p.got);
  }

  if (state === 'play') {
    const dx0 = dog.x + 7, dx1 = dog.x + 25, dy1 = G - dog.h, dy0 = G - DOG_H - dog.h + 6;
    for (const o of obstacles) {
      const ox0 = o.x + 2, ox1 = o.x + o.w - 2, oy1 = G - o.lift - 1, oy0 = G - o.lift - o.h + 2;
      if (dx0 < ox1 && dx1 > ox0 && dy0 < oy1 && dy1 > oy0) {
        o.dead = true; puff(o.x + o.w / 2, G - o.lift - o.h / 2, 16, ['#ffffff', '#e6ecff', '#ffd34d'], 70); crash(); break;
      }
    }
    for (const p of pickups) {
      const py1 = G - p.h, py0 = py1 - 9;
      if (dog.x + 4 < p.x + 9 && dog.x + 28 > p.x && G - DOG_H - dog.h + 2 < py1 && G - dog.h > py0) {
        p.got = true; gifts++; sfx.gift(); hap('select');
        puff(p.x + 4, py0 + 4, 8, ['#ffd34d', '#ffffff', '#ff8af0'], 45); floatText(p.x, py0 - 2, '+10');
      }
    }
  }

  for (const p of parts) { p.x += p.vx * dt; p.vy += p.g * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  const wind = (state === 'play' || state === 'slip') ? speed * 0.22 : 12;
  for (const f of flakes) { f.y += f.vy * dt; f.x += (Math.sin(t * 1.3 + f.ph) * 8 - wind) * dt; if (f.y > H) { f.y = -2; f.x = R() * W; } if (f.x < -2) f.x += W + 4; if (f.x > W + 2) f.x -= W + 4; }
  if (fade > 0) fade = Math.max(0, fade - dt / 1.3);

  if (LOCS[locIdx] && LOCS[locIdx].sleigh) {
    if (!sleigh) { sleighT -= dt; if (sleighT <= 0) sleigh = { x: -50, y: Math.max(8, G * 0.12 + R() * G * 0.15) }; }
    else { sleigh.x += 42 * dt; if (R() < 0.5) parts.push({ x: sleigh.x + 2, y: sleigh.y + 12 + Math.sin(t * 3) * 3, vx: -8, vy: 6, g: 0, life: 0.8, max: 0.8, col: R() < .5 ? '#ffd34d' : '#ffffff', s: 1, w: false }); if (sleigh.x > W + 10) { sleigh = null; sleighT = rnd(5, 9); } }
  } else sleigh = null;

  if (state === 'play') {
    const sc = score();
    if (sc !== lastHud.sc) { $('sc').textContent = sc; lastHud.sc = sc; }
    if (gifts !== lastHud.g) { $('gf').textContent = '🎁 ' + gifts; lastHud.g = gifts; }
  }
}
const lastHud = { sc: -1, g: -1 };

function tile(img, off, y) { const w = img.width; let x = -Math.floor(off % w); if (x > 0) x -= w; for (; x < W; x += w) ctx.drawImage(img, x, y); }
function drawLoc(L) {
  ctx.drawImage(L.sky, 0, 0);
  for (const s of L.stars) { const v = Math.sin(t * s.sp + s.ph); if (v > 0.6) { ctx.fillStyle = '#ffffff'; ctx.fillRect(s.x - 1, s.y, 3, 1); ctx.fillRect(s.x, s.y - 1, 1, 3); } }
  if (L.sleigh && sleigh) ctx.drawImage(SLEIGH, Math.round(sleigh.x), Math.round(sleigh.y + Math.sin(t * 3) * 3));
  tile(L.far, worldX * 0.12, 0);
  tile(L.mid, worldX * 0.4, 0);
  tile(L.ground, worldX, G);
}
function render() {
  const L = LOCS[locIdx];
  if (fade > 0 && prevLoc >= 0) { drawLoc(LOCS[prevLoc]); ctx.globalAlpha = 1 - fade; drawLoc(L); ctx.globalAlpha = 1; }
  else drawLoc(L);
  if (L.mid && locIdx === 2) { // огонь в камине мерцает
    const ox = -Math.floor((worldX * 0.4) % TW);
    for (let x = ox; x < W; x += TW) { if (Math.sin(t * 13) > 0) { ctx.fillStyle = '#fff0a0'; ctx.fillRect(x + 41, G - 11, 2, 2); } ctx.fillStyle = Math.sin(t * 9) > 0 ? '#ffb02e' : '#ff6a1a'; ctx.fillRect(x + 37 + (Math.sin(t * 7) > 0 ? 1 : 0), G - 16, 2, 2); }
  }
  for (const p of pickups) {
    const y = Math.round(G - p.h - 10 + Math.sin(t * 4 + p.ph) * 1.5);
    ctx.drawImage(p.spr, Math.round(p.x) - 1, y);
    if (Math.sin(t * 6 + p.ph) > 0.7) { ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(p.x) + 9, y, 1, 1); }
  }
  for (const o of obstacles) ctx.drawImage(o.spr, Math.round(o.x) - 1, Math.round(G - o.lift - o.h - 1));

  // Вова
  let pose, shake = 0;
  if (state === 'slip') { if (slipT < 1.15) pose = 'slide'; else { pose = 'n'; shake = slipT < 1.55 ? (Math.sin(t * 70) > 0 ? 1 : -1) : 0; } }
  else if (state === 'over') pose = 'n';
  else pose = dog.h > 0 ? 'jump' : RUN[Math.floor(dog.anim) % 4];
  const sw = Math.max(6, 18 - dog.h / 5);
  ctx.fillStyle = 'rgba(10,15,40,0.22)'; ctx.fillRect(Math.round(dog.x + 15 - sw / 2), G - 1, Math.round(sw), 2);
  ctx.drawImage(DOG[pose], Math.round(dog.x + shake), Math.round(G - DOG_H - dog.h));

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
    if (p.txt) { ctx.fillStyle = '#ffd34d'; ctx.font = '8px "Press Start 2P", monospace'; ctx.fillText(p.txt, Math.round(p.x), Math.round(p.y)); }
    else { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
  }
  ctx.globalAlpha = 1;
  if (L.snow || (fade > 0 && prevLoc >= 0 && LOCS[prevLoc].snow)) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (const f of flakes) ctx.fillRect(Math.round(f.x), Math.round(f.y), f.s, f.s);
  }
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (!document.hidden) { update(dt); render(); music.tick(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); if (AC) { if (document.hidden) AC.suspend().catch(() => {}); else AC.resume().catch(() => {}); } });

/* ================= Ввод ================= */
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
$('menu').addEventListener('pointerdown', e => { e.preventDefault(); start(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (state === 'over') { if (!$('again').disabled) start(); } else press(); }
  if (e.code === 'Enter' && state === 'over' && !$('again').disabled) start();
});
$('again').addEventListener('click', start);
$('share').addEventListener('click', share);
const setMuteIcon = () => { $('mute').textContent = muted ? '×' : '♪'; };
$('mute').addEventListener('pointerdown', e => e.stopPropagation());
$('mute').addEventListener('click', e => {
  e.stopPropagation(); muted = !muted; setMuteIcon();
  try { localStorage.setItem('vova_muted', muted ? '1' : '0'); } catch (err) {}
  if (!muted) { ensureAudio(); if (state === 'play' && AC) music.start(); }
});
setMuteIcon();

function share() {
  const sc = score(), url = SHARE_URL || location.href.split('#')[0];
  const text = `Вова пробежал ${Math.floor(worldX / 10)} м и собрал ${gifts} 🎁 — мой счёт ${sc}! Сможешь обогнать?`;
  const link = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
  if (inTG) { try { tg.openTelegramLink(link); return; } catch (e) {} }
  if (navigator.share) { navigator.share({ text, url }).catch(() => {}); return; }
  try { navigator.clipboard.writeText(text + ' ' + url); banner('Скопировано!'); } catch (e) { window.open(link, '_blank'); }
}

/* ================= Старт ================= */
$('hello').textContent = 'Вова уже ждёт 🐾';
window.__tgInit = initTG; if (window.__tgLoaded || (window.Telegram && window.Telegram.WebApp)) initTG();
store.get('vova_best').then(v => { if (v < best) return; best = v; $('bs').textContent = 'РЕКОРД ' + best; $('mbest').textContent = best ? 'Твой рекорд: ' + best : ''; });
layout();
requestAnimationFrame(frame);
})();
</script>
